version: "3"

tasks:
  build:
    desc: "[macOS] Build debian-mac image using version number from .env"
    cmds:
      - echo "🍎 [macOS] build → docker compose build debian-mac"
      - docker compose -f build/docker-compose.yml build debian-mac

  push:
    desc: "[macOS] Push debian-mac image to registry (requires IMAGE_NAMESPACE, IMAGE_NAME, IMAGE_TAG in .env)"
    deps:
      - build
    cmds:
      - echo "🍎 [macOS] push → build/push-with-retry.sh"
      - build/push-with-retry.sh

  build-and-push:
    desc: "[macOS] Build debian-mac image and push it to the registry"
    cmds:
      - echo "🍎 [macOS] build-and-push → running build, then push"
      - task: build
      - task: push
      - echo "🍎 [macOS] build-and-push → done"

  build:devcontainer-base-local:
    desc: Build local base image for devcontainer without pulling from registry
    cmds:
      - docker build -f build/Dockerfile.debian -t polyhost-devcontainer:debian-local build

  devcontainer:sync-env:
    desc: Regenerate .devcontainer/debian/.env from build/.env (registry/tag)
    cmds:
      - .devcontainer/scripts/sync-build-env.sh
