version: "3"

tasks:
  build:mac:
    desc: Build mac image using version number from .env
    cmds:
      - docker compose -f build/docker-compose.yml build debian-mac

  push:
    desc: Push image to registry (requires IMAGE_NAMESPACE, IMAGE_NAME, IMAGE_TAG in .env)
    deps:
      - build:mac
    cmds:
      - build/push-with-retry.sh

  build-and-push:
    desc: Build mac image with version and push to registry
    cmds:
      - task build:mac
      - task push

  build:devcontainer-base-local:
    desc: Build local base image for devcontainer without pulling from registry
    cmds:
      - docker build -f build/Dockerfile.debian -t polyhost-devcontainer:debian-local build

  devcontainer:sync-env:
    desc: Regenerate .devcontainer/debian/.env from build/.env (registry/tag)
    cmds:
      - .devcontainer/scripts/sync-build-env.sh
